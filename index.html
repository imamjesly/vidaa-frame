<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>VIDAA Frame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="wall">
    <div class="layer" id="wallA"></div>
    <div class="layer" id="wallB"></div>
    <video id="wallVideo" muted loop playsinline></video>
    <div id="scrim"></div>
  </div>

  <div id="status">
    <div class="chip" id="netChip"><span class="dot" id="netDot"></span><span id="netIcon"></span><span id="netText">Wi‑Fi</span></div>
  </div>

  <div id="clock">
    <div class="glass clockGlass">
      <div id="time"><span id="hm">--:--</span><span id="ampm"></span></div>
    </div>
    <div id="date"></div>
  </div>

  <div id="rows">
    <div class="row" id="rowDock"><div class="rlabel">Apps</div><div class="track" id="trackDock"></div></div>
    <div class="row" id="rowTray"><div class="rlabel">Connections</div><div class="track" id="trackTray"></div></div>
  </div>

  <div id="sheet" class="hidden">
    <div id="sheetHead"><span id="sheetTitle"></span></div>
    <div id="sheetBody"></div>
    <div id="sheetHint"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="apps.js"></script>
<script src="vidaa.js"></script>
<script src="main.js"></script>
</body>
</html>
